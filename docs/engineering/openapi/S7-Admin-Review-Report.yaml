openapi: 3.1.0
info:
  title: IELTS App S7 Admin Governance API Extensions
  version: 0.7.0
  description: |
    Sprint S7 API contract extension for:
    - high-risk operation dual-review workflow
    - content batch import, review and rollback workflow
    - admin operation/business report export and download audit
servers:
  - url: http://localhost:8787
paths:
  /v1/admin/reviews:
    post:
      summary: Create a dual-review request for high-risk operation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operation_type, request_reason]
              properties:
                operation_type:
                  type: string
                  enum: [user_freeze, entitlement_adjust, content_publish]
                request_reason:
                  type: string
                target_user_id:
                  type: string
                  format: uuid
                target_content_item_id:
                  type: string
                  format: uuid
                freeze:
                  type: object
                  properties:
                    reason:
                      type: string
                entitlement_adjust:
                  type: object
                  properties:
                    reason:
                      type: string
                    set_tier:
                      type: string
                      enum: [free, pro]
                    delta_days:
                      type: integer
                    rollback_of_adjustment_id:
                      type: string
                      format: uuid
                content_publish:
                  type: object
                  properties:
                    note:
                      type: string
                    simulate_failure:
                      type: boolean
      responses:
        '201':
          description: Review request created
        '400':
          description: Validation error
        '403':
          description: Forbidden by RBAC
    get:
      summary: List dual-review requests with filters
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, approved, rejected]
        - in: query
          name: operation_type
          schema:
            type: string
            enum: [user_freeze, entitlement_adjust, content_publish]
        - in: query
          name: requester_admin_user_id
          schema:
            type: string
            format: uuid
        - in: query
          name: reviewer_admin_user_id
          schema:
            type: string
            format: uuid
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: page_size
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Review request page
        '403':
          description: Forbidden by RBAC
  /v1/admin/reviews/{review_id}/approve:
    post:
      summary: Approve and execute a dual-review request
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: review_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
      responses:
        '200':
          description: Review approved
        '403':
          description: Forbidden by RBAC
        '404':
          description: Review not found
        '409':
          description: Review conflict or business conflict
  /v1/admin/reviews/{review_id}/reject:
    post:
      summary: Reject a dual-review request
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: review_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                comment:
                  type: string
      responses:
        '200':
          description: Review rejected
        '403':
          description: Forbidden by RBAC
        '404':
          description: Review not found
        '409':
          description: Review conflict
  /v1/admin/content/import/batches:
    post:
      summary: Import content items in batch
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template_version, items]
              properties:
                template_version:
                  type: string
                atomic:
                  type: boolean
                items:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [title, skill, payload]
                    properties:
                      title:
                        type: string
                      skill:
                        type: string
                        enum: [listening, speaking, reading, writing]
                      payload:
                        type: object
      responses:
        '201':
          description: Batch import completed
        '400':
          description: Validation error
        '403':
          description: Forbidden by RBAC
  /v1/admin/content/import/batches/{batch_id}/rollback:
    post:
      summary: Roll back imported content batch or selected items
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: batch_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                item_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Rollback completed
        '400':
          description: Invalid rollback request
        '403':
          description: Forbidden by RBAC
        '404':
          description: Batch not found
        '409':
          description: Rollback blocked by published items
  /v1/admin/content/items/{item_id}/review:
    post:
      summary: Review content item and optionally auto-publish
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: item_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approve, reject]
                note:
                  type: string
                auto_publish:
                  type: boolean
                simulate_failure:
                  type: boolean
      responses:
        '200':
          description: Review completed
        '400':
          description: Validation error
        '403':
          description: Forbidden by RBAC
        '404':
          description: Content not found
        '409':
          description: Review or publish conflict
  /v1/admin/reports/export:
    post:
      summary: Export admin operation/business report with masking
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [report_type]
              properties:
                report_type:
                  type: string
                  enum: [operation, business]
                from_at:
                  type: string
                  format: date-time
                to_at:
                  type: string
                  format: date-time
                role:
                  type: string
                  enum: [super_admin, finance, ops]
      responses:
        '201':
          description: Export generated
        '400':
          description: Validation error or invalid time range
        '403':
          description: Forbidden by RBAC
  /v1/admin/reports/exports/{export_id}/download:
    get:
      summary: Download exported report and track download audit
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: export_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Report content returned
        '403':
          description: Forbidden by RBAC
        '404':
          description: Export not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
