openapi: 3.1.0
info:
  title: IELTS App S5 API Extensions
  version: 0.5.0
  description: |
    Sprint S5 API contract extension for:
    - writing rewrite re-evaluation and comparison archive
    - full-skill timed mock exam, report, plan writeback and undo
    - subscription entitlement, upgrade/cancel/resume and payment webhook
    - admin login, order query and entitlement manual adjustment with rollback
    - P1 coupon discount configuration, validation and refund accounting consistency
    - P1 family duo plan with invitation/member management and over-capacity handling
servers:
  - url: http://localhost:8787
paths:
  /v1/writing/evaluations/{evaluation_id}/rewrite:
    post:
      summary: Rewrite essay and compare with source evaluation
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: evaluation_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [essay]
              properties:
                essay:
                  type: string
                  minLength: 30
                  maxLength: 20000
      responses:
        '201':
          description: Rewrite evaluation and comparison created
        '404':
          description: Source evaluation not found
  /v1/writing/archives:
    get:
      summary: Get writing rewrite archive
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Archive list
  /v1/mock-exams:
    post:
      summary: Create full-skill timed mock exam
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                time_limit_seconds:
                  type: integer
                  minimum: 1800
                  maximum: 14400
      responses:
        '201':
          description: Mock exam created
        '429':
          description: Free quota exceeded
  /v1/mock-exams/{exam_id}:
    get:
      summary: Get mock exam state for recovery
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: exam_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Mock exam state
        '404':
          description: Mock exam not found
  /v1/mock-exams/{exam_id}/progress:
    post:
      summary: Save per-skill mock exam progress
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: exam_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skill, answered_count]
              properties:
                skill:
                  type: string
                  enum: [listening, speaking, reading, writing]
                answered_count:
                  type: integer
                  minimum: 0
                completed:
                  type: boolean
      responses:
        '200':
          description: Progress saved
        '409':
          description: Exam already submitted
  /v1/mock-exams/{exam_id}/recover:
    post:
      summary: Recover mock exam timer/checkpoint
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: exam_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Exam recovered
        '409':
          description: Exam not recoverable
  /v1/mock-exams/{exam_id}/submit:
    post:
      summary: Submit mock exam and generate report
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: exam_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                skill_bands:
                  type: object
                  properties:
                    listening:
                      type: number
                    speaking:
                      type: number
                    reading:
                      type: number
                    writing:
                      type: number
      responses:
        '200':
          description: Submitted with report payload
  /v1/mock-exams/{exam_id}/report:
    get:
      summary: Get mock exam report and apply plan writeback
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: exam_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Report returned
        '409':
          description: Report not ready
  /v1/mock-exams/{exam_id}/report/writeback/undo:
    post:
      summary: Undo report-to-plan writeback once
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: exam_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Undo completed
        '409':
          description: Not undoable/already undone
  /v1/mock-exams/{exam_id}/report/export:
    get:
      summary: Export report content
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: exam_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Export content
  /v1/subscription/entitlement:
    get:
      summary: Get entitlement and remaining quota
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: device_id
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Entitlement state
  /v1/subscription/upgrade:
    post:
      summary: Create upgrade order
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_code]
              properties:
                plan_code:
                  type: string
                  enum: [pro_monthly, pro_yearly, family_duo_monthly]
                provider:
                  type: string
                  enum: [mockpay, stripe, alipay]
                  description: Optional. When omitted, server uses current runtime default provider.
                coupon_code:
                  type: string
                  description: Optional coupon code for discount.
      responses:
        '201':
          description: Upgrade order created
        '409':
          description: Invalid/expired/inactive coupon
  /v1/subscription/cancel:
    post:
      summary: Cancel auto-renew
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Entitlement updated
  /v1/subscription/resume:
    post:
      summary: Resume auto-renew
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Entitlement updated
        '409':
          description: Not resumable
  /v1/subscription/family/invitations:
    post:
      summary: Create family member invitation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invitee_user_id]
              properties:
                invitee_user_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Invitation created
        '404':
          description: Invitee not found
        '409':
          description: Family plan missing/member exists/capacity exceeded
  /v1/subscription/family/invitations/{invitation_id}/accept:
    post:
      summary: Accept family invitation
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: invitation_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Invitation accepted and entitlement updated
        '403':
          description: Forbidden for non-invitee
        '404':
          description: Invitation not found
        '409':
          description: Invalid state or capacity exceeded
  /v1/subscription/family/members:
    get:
      summary: List family owner/member statuses
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Family group and member list
        '409':
          description: Active family plan required
  /v1/subscription/family/members/{member_user_id}:
    delete:
      summary: Remove one family member seat
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: member_user_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Member removed
        '404':
          description: Member not found
        '409':
          description: Active family plan required
  /v1/payments/webhooks/provider:
    post:
      summary: Provider webhook for payment status update and refund accounting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_id, order_id, status]
              properties:
                event_id:
                  type: string
                order_id:
                  type: string
                  format: uuid
                status:
                  type: string
                  enum: [paid, failed, refunded]
                provider_order_id:
                  type: string
      responses:
        '200':
          description: Webhook applied or idempotent
  /v1/admin/auth/login:
    post:
      summary: Admin login with role/menu payload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Admin token issued
        '403':
          description: Invalid credentials
        '429':
          description: Login rate limited
  /v1/admin/orders:
    get:
      summary: Query orders with filters, pagination and accounting fields
      security:
        - adminBearerAuth: []
      parameters:
        - in: query
          name: user_id
          schema:
            type: string
            format: uuid
        - in: query
          name: status
          schema:
            type: string
            enum: [created, paid, failed, cancelled, refunded]
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: page_size
          schema:
            type: integer
      responses:
        '200':
          description: Order list
        '403':
          description: Forbidden
  /v1/admin/coupons:
    get:
      summary: Query coupon rules with filters and pagination
      security:
        - adminBearerAuth: []
      parameters:
        - in: query
          name: code
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [active, inactive]
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: page_size
          schema:
            type: integer
      responses:
        '200':
          description: Coupon list
        '403':
          description: Forbidden
  /v1/admin/coupons/{coupon_code}:
    put:
      summary: Upsert coupon rule
      security:
        - adminBearerAuth: []
      parameters:
        - in: path
          name: coupon_code
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [discount_type, discount_value]
              properties:
                status:
                  type: string
                  enum: [active, inactive]
                description:
                  type: string
                discount_type:
                  type: string
                  enum: [percentage, fixed_amount]
                discount_value:
                  type: number
                max_discount_cny:
                  type: integer
                plan_codes:
                  type: array
                  items:
                    type: string
                    enum: [pro_monthly, pro_yearly, family_duo_monthly]
                starts_at:
                  type: string
                  format: date-time
                expires_at:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Coupon upserted
        '400':
          description: Invalid coupon rule
        '403':
          description: Forbidden
  /v1/admin/entitlements/{user_id}/adjust:
    post:
      summary: Manual entitlement adjustment with one-time rollback
      security:
        - adminBearerAuth: []
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                set_tier:
                  type: string
                  enum: [free, pro]
                delta_days:
                  type: integer
                rollback_of_adjustment_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Adjustment applied
        '403':
          description: Forbidden
        '404':
          description: Adjustment not found
        '409':
          description: Adjustment already rolled back
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
    adminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
