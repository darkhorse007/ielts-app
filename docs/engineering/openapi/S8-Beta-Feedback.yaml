openapi: 3.1.0
info:
  title: IELTS App S8 Beta Feedback API Extensions
  version: 0.8.1
  description: |
    Sprint S8 API contract extension (US-10201):
    - beta whitelist management
    - beta feedback ingestion with auto release mapping
    - feedback query by id
    - one-click feedback priority escalation
    - optimistic lock (`expected_version`) and conflict semantics
servers:
  - url: http://localhost:8787
paths:
  /v1/system/beta/whitelist/{user_id}:
    put:
      summary: Upsert beta whitelist entry for target user
      description: |
        Supports optimistic lock (`expected_version`) and idempotency replay (`x-idempotency-key`).
        Version conflict returns `BETA_WHITELIST_VERSION_CONFLICT`.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: x-idempotency-key
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [release_id]
              properties:
                release_id:
                  type: string
                status:
                  type: string
                  enum: [active, disabled]
                note:
                  type: string
                expected_version:
                  type: integer
                  minimum: 0
      responses:
        '200':
          description: Whitelist entry upserted. Response includes `version`.
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Missing permission beta:manage
        '409':
          description: `IDEMPOTENCY_KEY_CONFLICT` or `BETA_WHITELIST_VERSION_CONFLICT`
  /v1/system/beta/whitelist:
    get:
      summary: List beta whitelist entries
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: user_id
          schema:
            type: string
            format: uuid
        - in: query
          name: release_id
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [active, disabled]
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: page_size
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Whitelist page
  /v1/system/beta/feedback:
    post:
      summary: Submit beta feedback (auto-associated to latest active whitelist release)
      description: |
        Supports idempotency replay with `x-idempotency-key`.
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: x-idempotency-key
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description, category, severity]
              properties:
                title:
                  type: string
                description:
                  type: string
                category:
                  type: string
                  enum: [bug, ux, performance, other]
                severity:
                  type: string
                  enum: [low, medium, high, critical]
                app_version:
                  type: string
      responses:
        '201':
          description: Feedback submitted. Response includes `version`.
        '403':
          description: Current user is not in beta whitelist or missing permission beta:manage
        '409':
          description: `IDEMPOTENCY_KEY_CONFLICT`
    get:
      summary: List beta feedback records
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: user_id
          schema:
            type: string
            format: uuid
        - in: query
          name: release_id
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [open, triaged, resolved]
        - in: query
          name: priority
          schema:
            type: string
            enum: [low, medium, high, critical]
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: page_size
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Feedback page
  /v1/system/beta/feedback/{feedback_id}:
    get:
      summary: Get beta feedback by id
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: feedback_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Feedback detail returned
        '404':
          description: Feedback not found
  /v1/system/beta/feedback/{feedback_id}/escalate:
    post:
      summary: One-click escalate feedback priority to high or critical
      description: |
        Supports optimistic lock (`expected_version`) and idempotency replay (`x-idempotency-key`).
        Version conflict returns `BETA_FEEDBACK_VERSION_CONFLICT`.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: feedback_id
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: x-idempotency-key
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [priority, reason]
              properties:
                priority:
                  type: string
                  enum: [high, critical]
                reason:
                  type: string
                expected_version:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Feedback escalated. Response includes latest `version`.
        '404':
          description: Feedback not found
        '409':
          description: `IDEMPOTENCY_KEY_CONFLICT` or `BETA_FEEDBACK_VERSION_CONFLICT`
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
