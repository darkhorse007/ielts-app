openapi: 3.1.0
info:
  title: IELTS App S2 API Extensions
  version: 0.2.0
  description: |
    Sprint S2 API contract extension for progress sync, account deletion,
    diagnostic workflow, and 8-week study plan.
servers:
  - url: http://localhost:8787
paths:
  /v1/users/me/progress:
    get:
      summary: Get latest merged progress snapshot
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Progress snapshot
  /v1/users/me/progress/sync:
    post:
      summary: Sync client progress snapshot to server
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_updated_at, progress]
              properties:
                device_id:
                  type: string
                client_updated_at:
                  type: string
                  format: date-time
                progress:
                  type: object
                  required:
                    - listening_completed
                    - speaking_completed
                    - reading_completed
                    - writing_completed
                    - total_study_minutes
                    - streak_days
                  properties:
                    listening_completed:
                      type: integer
                      minimum: 0
                    speaking_completed:
                      type: integer
                      minimum: 0
                    reading_completed:
                      type: integer
                      minimum: 0
                    writing_completed:
                      type: integer
                      minimum: 0
                    total_study_minutes:
                      type: integer
                      minimum: 0
                    streak_days:
                      type: integer
                      minimum: 0
      responses:
        '200':
          description: Sync result
        '400':
          description: Invalid payload
        '401':
          description: Unauthorized
  /v1/users/me/progress/conflicts:
    get:
      summary: Query progress conflict history for current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Conflict history
  /v1/users/me/profile:
    get:
      summary: Get account profile and status
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
        '401':
          description: Unauthorized
  /v1/users/me/deletion-request:
    post:
      summary: Request account deletion
      security:
        - bearerAuth: []
      responses:
        '202':
          description: Deletion requested
        '404':
          description: User not found
        '409':
          description: User already deleted
  /v1/users/me/delete:
    post:
      summary: Delete account and user data
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm_text]
              properties:
                confirm_text:
                  type: string
                  enum: [DELETE]
      responses:
        '200':
          description: Account deleted
        '400':
          description: Validation error
        '404':
          description: User not found
        '409':
          description: User already deleted
  /v1/users/onboarding/{assessment_id}/questions:
    get:
      summary: Start/resume diagnostic and fetch minimal question package
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: assessment_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Question package and progress
        '404':
          description: Assessment not found
  /v1/users/onboarding/{assessment_id}/answers:
    post:
      summary: Submit one diagnostic answer
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: assessment_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question_id, answer]
              properties:
                question_id:
                  type: string
                  format: uuid
                answer:
                  type: string
                  maxLength: 5000
      responses:
        '200':
          description: Answer accepted
        '404':
          description: Assessment or question not found
        '409':
          description: Assessment paused/completed
  /v1/users/onboarding/{assessment_id}/pause:
    post:
      summary: Pause diagnostic
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: assessment_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Paused
        '404':
          description: Assessment not found
  /v1/users/onboarding/{assessment_id}/resume:
    post:
      summary: Resume diagnostic
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: assessment_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Resumed
        '404':
          description: Assessment not found
        '409':
          description: Assessment already completed
  /v1/users/onboarding/{assessment_id}/complete:
    post:
      summary: Complete diagnostic and generate skill estimates + plan
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: assessment_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Completed with skill bands and plan_id
        '404':
          description: Assessment not found
  /v1/users/plans/active:
    get:
      summary: Get active 8-week study plan
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active plan with adjustment_history
        '404':
          description: Plan not found
  /v1/users/plans/{plan_id}/tasks/{task_id}:
    patch:
      summary: Manually adjust one task in active plan
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: plan_id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: task_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target_minutes:
                  type: integer
                  minimum: 5
                  maximum: 240
                completion_criteria:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        '200':
          description: Plan adjusted and adjustment history appended
        '400':
          description: Validation error
        '404':
          description: Plan/task not found
  /v1/users/plans/{plan_id}/adjustments:
    get:
      summary: Query plan adjustment history with reasons
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: plan_id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: source_type
          required: false
          schema:
            type: string
            enum: [manual_task_adjustment, practice_session, speaking_session, writing_evaluation, mock_exam_report]
        - in: query
          name: skill
          required: false
          schema:
            type: string
            enum: [listening, speaking, reading, writing]
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
        - in: query
          name: page_size
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Paged adjustment history with reason and changed_tasks
        '400':
          description: Validation error
        '404':
          description: Plan not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
