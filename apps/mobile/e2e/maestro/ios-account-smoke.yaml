appId: host.exp.Exponent
name: iOS account smoke
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- openLink:
    link: ${APP_URL}
- runFlow:
    when:
      visible: 'Open in ".*"'
    commands:
      - tapOn: Open
- runFlow:
    when:
      visible: Continue
    commands:
      - tapOn: Continue
- runFlow:
    when:
      visible: Close
    commands:
      - tapOn: Close
- runFlow:
    when:
      visible: Continue
    commands:
      - tapOn: Continue
- runFlow:
    when:
      visible: Close
    commands:
      - tapOn: Close
- runFlow:
    when:
      visible: 绑定你的 API / WS 实例
    commands:
      - tapOn:
          id: instance.save
- extendedWaitUntil:
    visible: 登录移动端工作台
    timeout: 15000
- tapOn: 去注册
- assertVisible: 先把账号创建出来
- tapOn:
    id: register.email
- inputText: ${REGISTER_EMAIL}
- tapOn:
    id: register.password
- inputText: ${REGISTER_PASSWORD}
- hideKeyboard
- tapOn:
    id: register.confirmPassword
- inputText: ${REGISTER_PASSWORD}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: register.submit
    direction: DOWN
    timeout: 15000
- tapOn:
    id: register.submit
- extendedWaitUntil:
    visible: 登录移动端工作台
    timeout: 15000
- tapOn:
    id: login.identifier
- inputText: ${REGISTER_EMAIL}
- tapOn:
    id: login.password
- inputText: ${REGISTER_PASSWORD}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: login.submit
    direction: DOWN
    timeout: 15000
- tapOn:
    id: login.submit
- extendedWaitUntil:
    visible: 自托管移动端骨架已落地
    timeout: 20000
- extendedWaitUntil:
    visible: 进入账户中心
    timeout: 15000
- tapOn: 进入账户中心
- extendedWaitUntil:
    visible: 账户中心已进入移动端
    timeout: 15000
- scrollUntilVisible:
    element:
      id: account.reminderRefresh
    direction: DOWN
    timeout: 15000
- tapOn:
    id: account.reminderRefresh
- scrollUntilVisible:
    element:
      text: "deep_link: /plan"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: account.reminderScheduleLocal
- scrollUntilVisible:
    element:
      text: "local_target: /plan"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: account.reminderSyncRemote
- scrollUntilVisible:
    element:
      text: "remote_device_status: granted"
    direction: UP
    timeout: 15000
- scrollUntilVisible:
    element:
      id: account.requestDeletion
    direction: DOWN
    timeout: 15000
- extendedWaitUntil:
    visible: account_ready
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: account.requestDeletion
- extendedWaitUntil:
    visible: request_deletion_success
    timeout: 15000
- scrollUntilVisible:
    element:
      id: account.deleteNow
    direction: DOWN
    timeout: 15000
- waitForAnimationToEnd
- tapOn:
    id: account.deleteNow
- extendedWaitUntil:
    visible: 账号删除已完成
    timeout: 30000
- scrollUntilVisible:
    element:
      id: account.deleted.backLogin
    direction: DOWN
    timeout: 15000
- waitForAnimationToEnd
- tapOn:
    id: account.deleted.backLogin
- extendedWaitUntil:
    visible: 登录移动端工作台
    timeout: 30000
