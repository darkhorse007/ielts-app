appId: host.exp.exponent
name: Android mock exam smoke
---
- runFlow:
    when:
      visible: Continue
    commands:
      - tapOn: Continue
- runFlow:
    when:
      visible: Close
    commands:
      - tapOn: Close
- runFlow:
    when:
      visible: IELTS Mobile
    commands:
      - extendedWaitUntil:
          visible: Close
          timeout: 10000
      - tapOn: Close
- runFlow:
    when:
      visible: Close
    commands:
      - tapOn: Close
- runFlow:
    when:
      visible: 绑定你的 API / WS 实例
    commands:
      - tapOn:
          id: instance.save
- extendedWaitUntil:
    visible: 登录移动端工作台
    timeout: 15000
- tapOn: 去注册
- assertVisible: 先把账号创建出来
- tapOn:
    id: register.email
- inputText: ${REGISTER_EMAIL}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: register.password
    direction: DOWN
    timeout: 15000
    speed: 50
    waitToSettleTimeoutMs: 800
    visibilityPercentage: 20
    centerElement: true
- tapOn:
    id: register.password
- inputText: ${REGISTER_PASSWORD}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: register.confirmPassword
    direction: DOWN
    timeout: 15000
    speed: 50
    waitToSettleTimeoutMs: 800
    visibilityPercentage: 20
    centerElement: true
- tapOn:
    id: register.confirmPassword
- inputText: ${REGISTER_PASSWORD}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: register.submit
    direction: DOWN
    timeout: 15000
    speed: 50
    waitToSettleTimeoutMs: 800
    visibilityPercentage: 20
    centerElement: true
- tapOn:
    id: register.submit
- extendedWaitUntil:
    visible: 登录移动端工作台
    timeout: 15000
- tapOn:
    id: login.identifier
- inputText: ${REGISTER_EMAIL}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: login.password
    direction: DOWN
    timeout: 15000
    speed: 50
    waitToSettleTimeoutMs: 800
    visibilityPercentage: 20
    centerElement: true
- tapOn:
    id: login.password
- inputText: ${REGISTER_PASSWORD}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: login.submit
    direction: DOWN
    timeout: 15000
    speed: 50
    waitToSettleTimeoutMs: 800
    visibilityPercentage: 20
    centerElement: true
- tapOn:
    id: login.submit
- extendedWaitUntil:
    visible: 自托管移动端骨架已落地
    timeout: 20000
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: 进入模考
    direction: DOWN
    timeout: 25000
    speed: 35
    waitToSettleTimeoutMs: 1200
    visibilityPercentage: 1
    centerElement: false
- tapOn: 进入模考
- extendedWaitUntil:
    visible: 模考与报告已进入移动端
    timeout: 15000
- tapOn:
    id: mockExam.create
- extendedWaitUntil:
    visible: in_progress
    timeout: 15000
- scrollUntilVisible:
    element:
      id: mockExam.backHome
    direction: DOWN
    timeout: 15000
- waitForAnimationToEnd
- tapOn:
    id: mockExam.backHome
- extendedWaitUntil:
    visible: 自托管移动端骨架已落地
    timeout: 15000
