appId: host.exp.Exponent
name: iOS reminder notification smoke
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- openLink:
    link: ${APP_URL}
- runFlow:
    when:
      visible: 'Open in ".*"'
    commands:
      - tapOn: Open
- runFlow:
    when:
      visible: Continue
    commands:
      - tapOn: Continue
- runFlow:
    when:
      visible: Close
    commands:
      - tapOn: Close
- runFlow:
    when:
      visible: Continue
    commands:
      - tapOn: Continue
- runFlow:
    when:
      visible: Close
    commands:
      - tapOn: Close
- runFlow:
    when:
      visible: 绑定你的 API / WS 实例
    commands:
      - tapOn:
          id: instance.save
- extendedWaitUntil:
    visible: 登录移动端工作台
    timeout: 15000
- tapOn: 去注册
- assertVisible: 先把账号创建出来
- tapOn:
    id: register.email
- inputText: ${REGISTER_EMAIL}
- tapOn:
    id: register.password
- inputText: ${REGISTER_PASSWORD}
- hideKeyboard
- tapOn:
    id: register.confirmPassword
- inputText: ${REGISTER_PASSWORD}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: register.submit
    direction: DOWN
    timeout: 15000
- tapOn:
    id: register.submit
- extendedWaitUntil:
    visible: 登录移动端工作台
    timeout: 15000
- tapOn:
    id: login.identifier
- inputText: ${REGISTER_EMAIL}
- tapOn:
    id: login.password
- inputText: ${REGISTER_PASSWORD}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: login.submit
    direction: DOWN
    timeout: 15000
- tapOn:
    id: login.submit
- extendedWaitUntil:
    visible: 自托管移动端骨架已落地
    timeout: 20000
- scrollUntilVisible:
    element:
      id: home.account
    direction: DOWN
    timeout: 15000
- tapOn:
    id: home.account
- extendedWaitUntil:
    visible: 账户中心已进入移动端
    timeout: 15000
- scrollUntilVisible:
    element:
      id: account.reminderRefresh
    direction: DOWN
    timeout: 15000
- tapOn:
    id: account.reminderRefresh
- scrollUntilVisible:
    element:
      text: "deep_link: /plan"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: account.reminderSimulateNotificationOpen
- extendedWaitUntil:
    visible: 8 周计划已进入移动端
    timeout: 15000
